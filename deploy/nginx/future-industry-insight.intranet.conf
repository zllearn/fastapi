# 未来产业洞见系统 · nginx 反向代理（纯 HTTP 版）
#
# 适用：内网机器 / VPN 内访问 / 还没有域名或未完成备案的过渡期。
# 不适合公网裸跑：HTTP 下登录口令与 Cookie 都是明文，任何一跳都能嗅探。
#   若必须公网暴露，请只放行 VPN/办公网段，或改用 future-industry-insight.conf（HTTPS）。
#
# 安装：
#   sudo cp deploy/nginx/future-industry-insight.intranet.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/future-industry-insight.intranet.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 对应的 .env：AUTH_COOKIE_SECURE=0（HTTP 下置 1 浏览器会直接丢掉 Cookie，表现为"登录成功但仍是 401"）
#              TRUST_PROXY_HEADERS=1（走 nginx 都要开，否则登录锁定全记在 127.0.0.1 一个桶里）

limit_req_zone $binary_remote_addr zone=fii_login:2m rate=10r/m;

upstream fii_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/payload/ {
        proxy_pass http://fii_backend;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
        proxy_max_temp_file_size 64m;
        gzip off;   # 后端已返回预压缩 .json.gz
    }

    location = /api/auth/login {
        limit_req zone=fii_login burst=5 nodelay;
        proxy_pass http://fii_backend;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://fii_backend;
        proxy_read_timeout 60s;
    }
}
