# 未来产业洞见系统 · nginx 反向代理（HTTPS + 域名版）
#
# 安装：
#   sudo cp deploy/nginx/future-industry-insight.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/future-industry-insight.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 必改：下面两处 server_name 与证书路径换成自己的域名；
#       站点跑起来后把 .env 的 AUTH_COOKIE_SECURE=1、TRUST_PROXY_HEADERS=1 打开，
#       并重启应用服务（Cookie 只在 HTTPS 下发，IP 归属也依赖代理头）。
#
# 没有域名/未备案？先用同目录的 future-industry-insight.intranet.conf（纯 HTTP，限内网或 VPN）。

# 登录接口全局限流：应用内的失败锁定是进程内计数，多 worker 下阈值会翻倍，这里兜底。
limit_req_zone $binary_remote_addr zone=fii_login:2m rate=10r/m;

upstream fii_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name fii.example.com;

    # certbot http-01 验证目录（用 sudo certbot --nginx 时可忽略这一段）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.25.1 及以上可改写为 `listen 443 ssl;` + `http2 on;`
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fii.example.com;

    ssl_certificate     /etc/letsencrypt/live/fii.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fii.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # 首页用同源 iframe 承载子页面，DENY 会导致子页面空白
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # 确认 HTTPS 稳定后再打开：一旦下发，浏览器此后强制走 HTTPS，撤不回
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # 接口只收 JSON 登录体，无需放宽包体
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # 载荷：最大单文件约 25MB（derwent-dashboard.gz），桌面端首访要下载多个。
    # 缓冲放在 nginx 侧，慢客户端不会把 uvicorn worker 长期占住；
    # 读超时放宽是因为服务端可能在等跨进程构建锁（首次访问未预构建的载荷）。
    location /api/payload/ {
        proxy_pass http://fii_backend;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
        proxy_temp_file_write_size 256k;
        proxy_max_temp_file_size 64m;
        # 后端已按 Accept-Encoding 返回预压缩的 .json.gz，再压一次纯属浪费 CPU
        gzip off;
    }

    location = /api/auth/login {
        limit_req zone=fii_login burst=5 nodelay;
        proxy_pass http://fii_backend;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://fii_backend;
        proxy_read_timeout 60s;
    }
}
